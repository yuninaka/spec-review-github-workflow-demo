name: spec-review-prompt

# CIはAIを一切呼び出さない。プルリクエストを開いた/更新したタイミングで、
# 固定プロンプト(.github/SPEC_REVIEW_PROMPT.md)に今回の仕様書本文を埋め込んだ
# 状態でPRコメントとして提示するところまでを自動化する。実際にAIへ投げて
# 結果を確認する作業は、レビュワーが外部のAIツールでコピー&ペーストして行う。

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "spec/**"

permissions:
  pull-requests: write

jobs:
  post-review-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 固定プロンプトのプレースホルダを仕様書本文で置換する
        run: |
          set -euo pipefail
          awk -v specfile="spec/current-spec.md" '
            /^\(ここに仕様書の本文を貼り付ける\)$/ {
              while ((getline line < specfile) > 0) print line
              next
            }
            { print }
          ' .github/SPEC_REVIEW_PROMPT.md > /tmp/filled-prompt.txt

      - name: 埋め込み後のプロンプトをPRコメントとして投稿する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### 🪞 AIによる仕様書レビューを実施してください"
            echo ""
            echo "以下のプロンプトを(書き換えずに)コピーし、外部のAIツールに貼り付けて確認してください。"
            echo "このコメント自体はAIを呼び出していません。"
            echo ""
            echo '```text'
            cat /tmp/filled-prompt.txt
            echo '```'
          } > /tmp/comment-body.txt
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment-body.txt
