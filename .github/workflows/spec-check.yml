name: spec-check

on:
  pull_request:
    paths:
      - "spec/**"

permissions:
  pull-requests: write

jobs:
  check-required-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 必須セクションの有無を確認する
        id: check
        run: |
          set -euo pipefail
          spec_file="spec/current-spec.md"
          missing=""
          for section in "## 対象範囲" "## 変更内容" "## 確認事項"; do
            if ! grep -qF "$section" "$spec_file"; then
              missing="${missing}${section}\n"
            fi
          done
          if [ -n "$missing" ]; then
            echo "missing<<EOF" >> "$GITHUB_OUTPUT"
            echo -e "$missing" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: 結果をPRにコメントする(成功時)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "spec-check: spec/current-spec.md に必須セクション(対象範囲・変更内容・確認事項)が揃っています。"

      - name: 結果をPRにコメントする(失敗時)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "spec-check: spec/current-spec.md に必須セクションが不足しています。不足: ${{ steps.check.outputs.missing }}"
